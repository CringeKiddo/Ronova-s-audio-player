name: Build Ronova Audio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronova-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OBOE_VERSION: "1.9.0"
  SOUNDTOUCH_VERSION: "2.3.3"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"
  ANDROID_PLATFORM_API: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ninja --version

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch native third-party sources (Oboe + SoundTouch)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/third_party

          fetch_repo() {
            local name="$1" tag="$2" check="$3"
            shift 3
            local dest="native/third_party/${name}"
            if [ -f "${dest}/${check}" ]; then
              echo "${name} already present, skipping clone."
              return 0
            fi
            rm -rf "${dest}"
            for url in "$@"; do
              echo "Cloning ${name} ${tag} from ${url}"
              if git clone --depth 1 --branch "${tag}" "${url}" "${dest}"; then
                if [ -f "${dest}/${check}" ]; then
                  return 0
                fi
              fi
              rm -rf "${dest}"
            done
            echo "::error::Could not fetch ${name} ${tag}"
            return 1
          }

          fetch_repo oboe "${OBOE_VERSION}" CMakeLists.txt \
            https://github.com/google/oboe.git

          fetch_repo soundtouch "${SOUNDTOUCH_VERSION}" source/SoundTouch/SoundTouch.cpp \
            https://codeberg.org/soundtouch/soundtouch.git \
            https://gitlab.com/soundtouch/soundtouch.git

          test -f native/third_party/oboe/include/oboe/Oboe.h
          test -f native/third_party/soundtouch/include/SoundTouch.h

      - name: Bootstrap Gradle wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper from a throwaway Flutter scaffold..."
            SCAFFOLD_DIR="$(mktemp -d)"
            flutter create --platforms=android --project-name ronova_scaffold --org com.ronova "${SCAFFOLD_DIR}/scaffold"
            mkdir -p android/gradle/wrapper
            cp "${SCAFFOLD_DIR}/scaffold/android/gradlew" android/gradlew
            cp "${SCAFFOLD_DIR}/scaffold/android/gradlew.bat" android/gradlew.bat
            cp "${SCAFFOLD_DIR}/scaffold/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Flutter version and doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate temporary release keystore if none exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/release-key.jks ] && [ ! -f android/key.properties ]; then
            STORE_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::${STORE_PASS}"
            keytool -genkeypair -v \
              -keystore android/app/release-key.jks \
              -storepass "${STORE_PASS}" \
              -keypass "${STORE_PASS}" \
              -alias ronova \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ronova Audio, OU=CI, O=Ronova, L=Kingston, C=JM"
            {
              echo "storePassword=${STORE_PASS}"
              echo "keyPassword=${STORE_PASS}"
              echo "keyAlias=ronova"
              echo "storeFile=release-key.jks"
            } > android/key.properties
            echo "Temporary release keystore generated."
          else
            echo "Signing material already present, using it."
          fi

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ronova-audio-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
